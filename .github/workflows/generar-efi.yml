name: Generar EFI OCLP para iMac14,1

on:
  workflow_dispatch:

jobs:
  build-efi:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Instalar OpenCore Legacy Patcher 2.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/OpenCore-Patcher.pkg" \
            'https://github.com/dortania/OpenCore-Legacy-Patcher/releases/download/2.5.1/OpenCore-Patcher.pkg'
          sudo installer -pkg "$RUNNER_TEMP/OpenCore-Patcher.pkg" -target /

      - name: Generar, capturar y verificar EFI para iMac14,1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import shutil
          import signal
          import subprocess

          patcher = pathlib.Path('/Library/Application Support/Dortania/OpenCore-Patcher.app/Contents/MacOS/OpenCore-Patcher')
          if not patcher.is_file():
              raise SystemExit('ERROR: no está instalado OpenCore-Patcher.')

          command = [str(patcher), '--build', '--model', 'iMac14,1', '--verbose']
          proc = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
              cwd=os.environ['GITHUB_WORKSPACE'],
          )
          temp_dir = None
          captured = False
          exit_code = None
          try:
              for line in proc.stdout:
                  print(line, end='', flush=True)
                  if 'New payloads location: ' in line:
                      temp_dir = line.split('New payloads location: ', 1)[1].strip()

                  # La aplicación empaquetada borra la compilación temporal al salir.
                  # Se pausa JUSTO después de que OCLP haya terminado y validado.
                  if 'Your OpenCore EFI for iMac14,1 has been built at:' not in line:
                      continue

                  os.kill(proc.pid, signal.SIGSTOP)
                  try:
                      if not temp_dir:
                          raise RuntimeError('No se detectó la ruta temporal de OCLP.')

                      source = pathlib.Path(temp_dir) / 'Build-Folder' / 'OpenCore-Build'
                      oc = source / 'EFI' / 'OC'
                      config = oc / 'config.plist'
                      opencore = oc / 'OpenCore.efi'
                      # En OCLP 2.5.1 BOOTx64.efi se conserva como
                      # System/Library/CoreServices/boot.efi hasta instalar.
                      boot_candidates = [
                          source / 'EFI' / 'BOOT' / 'BOOTx64.efi',
                          source / 'System' / 'Library' / 'CoreServices' / 'boot.efi',
                      ]
                      boot = next((p for p in boot_candidates if p.is_file()), None)
                      missing = [str(p) for p in (config, opencore) if not p.is_file()]
                      if boot is None:
                          missing.append('BOOTx64.efi o System/Library/CoreServices/boot.efi')
                      if missing:
                          for path in sorted(source.rglob('*')):
                              if path.is_file():
                                  print('  EN COMPILACIÓN:', path.relative_to(source), flush=True)
                          raise RuntimeError('Archivos esenciales ausentes: ' + ', '.join(missing))

                      with config.open('rb') as handle:
                          settings = plistlib.load(handle)
                      revision = settings.get('#Revision', {})
                      if revision.get('Original-Model') != 'iMac14,1':
                          raise RuntimeError(f"Modelo inesperado: {revision.get('Original-Model')}")

                      out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'EFI-resultado'
                      dest = out / 'EFI'
                      dest.mkdir(parents=True, exist_ok=True)
                      shutil.copytree(oc, dest / 'OC', dirs_exist_ok=True)
                      (dest / 'BOOT').mkdir(exist_ok=True)
                      shutil.copy2(boot, dest / 'BOOT' / 'BOOTx64.efi')

                      for rel in ('OC/config.plist', 'OC/OpenCore.efi', 'BOOT/BOOTx64.efi'):
                          candidate = dest / rel
                          if not candidate.is_file() or candidate.stat().st_size == 0:
                              raise RuntimeError('Archivo ausente o vacío: ' + str(candidate))

                      print('\nEFI COMPLETA PARA iMac14,1:', flush=True)
                      print('  EFI/BOOT/BOOTx64.efi', flush=True)
                      print('  EFI/OC/OpenCore.efi', flush=True)
                      print('  EFI/OC/config.plist', flush=True)
                      print('  EFI/OC/Drivers y EFI/OC/Kexts (generados por OCLP)', flush=True)
                      captured = True
                  finally:
                      os.kill(proc.pid, signal.SIGCONT)

              exit_code = proc.wait()
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  proc.wait()

          if not captured:
              raise SystemExit('ERROR: OCLP no generó la EFI esperada.')
          if exit_code != 0:
              raise SystemExit(f'ERROR: OCLP terminó con código {exit_code}.')
          print('EFI verificada y lista para publicar como artefacto.', flush=True)
          PY

      - name: Publicar EFI descargable
        uses: actions/upload-artifact@v4
        with:
          name: EFI-OCLP-2.5.1-iMac14-1
          path: ${{ runner.temp }}/EFI-resultado/EFI/
          if-no-files-found: error
          retention-days: 7
